name: Deploy to GitHub Pages

# 触发条件：push 到 main 分支，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要 contents: write 权限，才能把构建产物推送到 gh-pages 分支
permissions:
  contents: write

# 同一时间只允许一个部署任务，避免并发推送 gh-pages 冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 构建：不注入 VITE_QWEN_API_KEY（仓库公开，密钥一旦打进 JS 包即可被任何人提取）
      - name: Build
        run: npm run build

      # SPA 路由回退：直接访问 /interview 时 GitHub Pages 返回 404.html，由 React Router 接管
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # 关闭 Jekyll 处理，避免下划线开头等文件被忽略
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # 将 dist 推送为 gh-pages 分支（Pages 发布源已指向该分支）
      - name: Push to gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
